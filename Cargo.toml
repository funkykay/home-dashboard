[package]
name = "pi-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Direct-display dashboard engine for Raspberry Pi OS Lite"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
crossbeam-channel = "0.5"
fontdue = "0.9"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "opt-simd-neon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
drm = "0.14"
libc = "0.2"
memmap2 = "0.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
